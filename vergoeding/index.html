<style>
  :root {
    --bg: #FFF5E4;
    --ink: #004542;
    --ink-soft: rgba(0, 69, 66, 0.62);
    --line: rgba(0, 69, 66, 0.22);
    --field: #FFFBF3;
    --font: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .progress { position: fixed; top: 0; left: 0; right: 0; height: 5px; background: var(--line); z-index: 10; }
  .progress i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .35s ease; }

  .site-header { max-width: 620px; margin: 0 auto; padding: 28px 24px 0; }
  .site-header a { display: inline-block; line-height: 0; }
  .logo-mark { width: 130px; height: auto; }

  .stage { max-width: 620px; margin: 0 auto; padding: 24px 24px 64px; min-height: calc(100vh - 70px); display: flex; flex-direction: column; justify-content: center; }
  html.embedded body { min-height: 0; }
  html.embedded .site-header { display: none; }
  html.embedded .stage { min-height: 0; justify-content: flex-start; }

  .screen { display: none; animation: in .3s ease both; }
  .screen.active { display: block; }
  @keyframes in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  h1 { font-weight: 800; font-size: clamp(32px, 7vw, 52px); line-height: 1.02; letter-spacing: -0.01em; margin: 0 0 18px; }
  h2 { font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.2; margin: 0 0 10px; }
  h3 { font-weight: 500; font-size: 17px; margin: 22px 0 10px; }
  p { margin: 0 0 14px; }
  .soft { color: var(--ink-soft); font-size: 15px; }
  .hint { color: var(--ink-soft); font-size: 15px; margin: 0 0 20px; }
  .eyebrow { display: block; font-size: 13px; font-weight: 500; letter-spacing: .08em; color: var(--ink-soft); margin-bottom: 10px; text-transform: uppercase; }

  .btn {
    display: inline-block; font: inherit; font-weight: 800; font-size: 18px;
    color: var(--bg); background: var(--ink); border: 0; border-radius: 999px;
    padding: 15px 30px; cursor: pointer; text-decoration: none; transition: transform .12s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }

  .answers { display: flex; flex-direction: column; gap: 10px; }
  .answers button {
    font: inherit; text-align: left; color: var(--ink);
    background: var(--field); border: 1.5px solid var(--line); border-radius: 12px;
    padding: 13px 18px 13px 54px; cursor: pointer; position: relative;
    transition: border-color .15s, background .15s, transform .12s;
  }
  .answers button .key {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border: 1.5px solid var(--line); border-radius: 7px;
    font-size: 13px; font-weight: 800; display: grid; place-items: center; background: #fff;
  }
  .answers.multi button .key { border-radius: 50%; }
  .answers button:hover, .answers button:focus-visible { border-color: var(--ink); background: #fff; outline: none; }
  .answers button.picked { border-color: var(--ink); background: #fff; }
  .answers button.picked .key { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .answers button:disabled { opacity: .45; cursor: default; }
  .answers.row { flex-direction: row; flex-wrap: wrap; }
  .answers.row button { padding: 11px 18px; }
  .answers.row button.picked { background: var(--ink); color: var(--bg); } /* geen letterblokje, dus de hele knop kleurt */

  .nav { display: flex; align-items: center; gap: 18px; margin-top: 26px; }
  .back { font: inherit; background: none; border: 0; color: var(--ink-soft); cursor: pointer; padding: 0; text-decoration: underline; }

  label.f { display: block; margin-bottom: 14px; }
  label.f span { display: block; font-weight: 500; margin-bottom: 6px; }
  input[type="text"], input[type="email"], textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--field);
    border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px;
  }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, textarea:focus { outline: 3px solid var(--ink); outline-offset: 2px; border-color: var(--ink); }
  .anders { margin-top: 10px; display: none; }
  .anders.show { display: block; }
  .err { color: #a33a20; font-size: 14px; margin-top: 8px; display: none; }
  .err.show { display: block; }

  @media (prefers-reduced-motion: reduce) { *, .screen { animation: none !important; transition: none !important; } }
</style>
</head>

<script>
/* ────────────────────────────────────────────────────────────────
   Vragenlijst over de vrijwilligersvergoeding, voor de evaluatie door het ministerie.
   - Antwoorden gaan naar PocketBase-collectie tcbnb_vergoeding_antwoorden.
   - Een e-mailadres (voor nieuws over de uitkomst) gaat naar een áparte collectie, tcbnb_vergoeding_nieuws,
     zonder koppeling naar de antwoorden. Zo blijven de antwoorden anoniem.
   - Per embed via de iframe-URL: ?plek=nieuwsbrief zet een label in het veld 'bron'.
──────────────────────────────────────────────────────────────── */
var PB = 'https://db.vdveen.online/api/collections/';
var params = new URLSearchParams(location.search);
var PLEK = (params.get('plek') || '').slice(0, 100);

var Q = {
  gastgezin: { type: 'single', q: 'Ben je nu nog gastgezin?', opts: ['Ja', 'Nee, ik ben gestopt'] },
  wist: { type: 'single', q: 'Wist je van de vergoeding toen je je aanmeldde?', opts: ['Ja', 'Nee', 'Weet ik niet meer'] },
  profiel: { type: 'duo', q: 'Wie ben je?', hint: 'Zo kunnen we zien of verschillende mensen er anders over denken.', parts: [
    { id: 'leeftijd', label: 'Hoe oud ben je?', opts: ['Onder 40', '40–54', '55–66', '67 of ouder'] },
    { id: 'huishouden', label: 'Met wie woon je?', opts: ['Alleen', 'Met partner', 'Met partner en kinderen', 'Alleen met kinderen', 'Anders'] }] },
  hoogte: { type: 'single', q: 'Wat vind je van de hoogte van de vergoeding?', opts: [
    'Te laag', 'Precies goed', 'Te hoog', 'Ik weet niet meer hoe hoog hij was'] },
  betekenis: { type: 'multi', max: 2, q: 'Wat betekent de vergoeding vooral voor je?', hint: 'Kies er maximaal twee.', opts: [
    'Ik voel me gezien in wat ik doe', 'Het is een mooi gebaar van de overheid', 'Het dekt de kosten die ik maak',
    'Ik heb het geld echt nodig', 'Het is een leuk extraatje', 'Het maakt me eigenlijk niet zoveel uit'] },
  zonder: { type: 'single', q: 'Had je je ook aangemeld zonder vergoeding?', opts: [
    'Zeker wel', 'Waarschijnlijk wel', 'Ik twijfel', 'Waarschijnlijk niet', 'Zeker niet'] },
  stopt: { type: 'single', q: 'Stel, de vergoeding stopt. Wat doe je dan?', opts: [
    'Ik ga gewoon door', 'Ik ga door, maar minder vaak of korter', 'Ik stop', 'Weet ik nog niet'] },
  waarom: { type: 'single', q: 'Waarom ben je gestopt?', opts: [
    'Mijn gast is vertrokken en ik neem geen nieuwe', 'Persoonlijke omstandigheden', 'Het kostte me meer dan het opleverde',
    'Gedoe rond de vergoeding', { t: 'Anders, namelijk…', anders: true }] },
  lastig: { type: 'multi', max: 3, q: 'Wat maakt gastgezin zijn soms lastig?', hint: 'Kies er maximaal drie.', opts: [
    'Mijn gast moet zich op mijn adres inschrijven', 'Mijn huis is eigenlijk te klein', 'Ik heb minder privacy',
    'Ik weet niet hoe lang mijn gast blijft', 'De taal', 'De vergoeding dekt mijn kosten niet', 'Vragen over belasting',
    'Zorgen over mijn toeslag of uitkering', 'De vergoeding kwam niet op tijd', { t: 'Niets', alleen: true },
    { t: 'Anders, namelijk…', anders: true }] },
  onverwacht: { type: 'open', q: 'Bracht de vergoeding iets wat je niet had verwacht?',
    hint: 'Bijvoorbeeld in het contact met je gast, met je familie of in je portemonnee.',
    fields: [{ id: 'onverwacht_goed', label: 'Iets goeds' }, { id: 'onverwacht_minder', label: 'Iets minder goeds' }] },
  nieuws: { type: 'nieuws' }
};

var A = {};          // antwoorden per vraag-id
var naam = '';
var step = -1;       // -1 intro, daarna index in seq(), voorbij het eind = bedankt
var KEYS = 'ABCDEFGHIJK';
var stage = document.getElementById('stage');
var bar = document.getElementById('bar');

function wist() { return A.wist === 'Ja'; }
function gestopt() { return A.gastgezin === 'Nee, ik ben gestopt'; }
function seq() {
  var s = ['gastgezin', 'wist', 'profiel', 'hoogte', 'betekenis'];
  if (!A.wist || wist()) s.push('zonder'); // alleen wie het wist, kan erdoor over de streep zijn getrokken
  s.push(gestopt() ? 'waarom' : 'stopt');
  return s.concat(['lastig', 'onverwacht', 'nieuws']);
}
function label(o) { return typeof o === 'string' ? o : o.t; }
function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function go(n) { step = n; render(); }

function render() {
  var s = seq();
  var vragen = s.length - 1; // 'nieuws' telt niet als vraag
  bar.style.width = (step < 0 ? 0 : Math.min(100, Math.round(step / vragen * 100))) + '%';
  if (step >= 0) toOuder({ tcbnbTop: true });
  stage.innerHTML = '';
  var el = document.createElement('section');
  el.className = 'screen active';
  stage.appendChild(el);

  if (step < 0) return intro(el);
  if (step >= s.length) return bedankt(el);

  var id = s[step], item = Q[id];
  var eyebrow = id === 'nieuws' ? 'Klaar!'
    : step === vragen - 1 ? 'Laatste vraag' + (naam ? ', ' + esc(naam) : '')
    : 'Vraag ' + (step + 1) + ' van ' + vragen;
  var head = '<span class="eyebrow">' + eyebrow + '</span>' + (item.q ? '<h2>' + item.q + '</h2>' : '') +
    (item.hint ? '<p class="hint">' + item.hint + '</p>' : '<div style="height:14px"></div>');
  var back = '<button class="back" id="back">Vorige</button>';

  if (item.type === 'single') single(el, id, item, head, back);
  else if (item.type === 'multi') multi(el, id, item, head, back);
  else if (item.type === 'duo') duo(el, item, head, back);
  else if (item.type === 'open') open(el, item, head, back);
  else nieuws(el);

  var b = document.getElementById('back');
  if (b) b.addEventListener('click', function () { go(step - 1); });
}

function intro(el) {
  el.innerHTML =
    '<span class="eyebrow">Takecarebnb</span>' +
    '<h1>Even over geld</h1>' +
    '<p>Vorige keer vertelden heel veel gastgezinnen ons hun verhaal. Dank je wel daarvoor! Nu hebben we nog een andere vraag: wat betekende de vrijwilligersvergoeding voor jou?</p>' +
    '<p>Over geld praten voelt soms ongemakkelijk. Toch helpt het ons als je eerlijk bent. Of de vergoeding nu het verschil maakte of nauwelijks iets uitmaakte. Het ministerie gebruikt jullie antwoorden om de proef met deze vergoeding te evalueren.</p>' +
    '<p class="soft">Ongeveer 5 minuten.</p>' +
    '<label class="f" style="margin-top:22px"><span>Hoe mogen we je noemen?</span><input type="text" id="naam" autocomplete="given-name" placeholder="Je voornaam" maxlength="60" value="' + esc(naam) + '"></label>' +
    '<p class="soft" style="margin-top:-6px">Mag ook leeg blijven.</p>' +
    '<div class="nav"><button class="btn" id="start">Ik doe mee</button></div>';
  var n = document.getElementById('naam');
  document.getElementById('start').addEventListener('click', function () { naam = n.value.trim(); go(0); });
}

function knoppen(item, gekozen, multi) {
  var h = '<div class="answers' + (multi ? ' multi' : '') + '" role="group">';
  item.opts.forEach(function (o, i) {
    var picked = gekozen.indexOf(label(o)) > -1 ? ' class="picked"' : '';
    h += '<button type="button" data-i="' + i + '"' + picked + '><span class="key">' + KEYS[i] + '</span>' + esc(label(o)) + '</button>';
  });
  return h + '</div>';
}

function andersVeld(id) {
  return '<div class="anders" id="andersBox"><input type="text" id="andersTxt" maxlength="300" placeholder="Vertel het in een paar woorden" value="' + esc(A[id + '_anders'] || '') + '"></div>';
}

function single(el, id, item, head, back) {
  var heeftAnders = item.opts.some(function (o) { return o.anders; });
  el.innerHTML = head + knoppen(item, [A[id]]) + (heeftAnders ? andersVeld(id) : '') +
    '<div class="nav">' + (heeftAnders ? '<button class="btn" id="verder" style="display:none">Verder</button>' : '') + back + '</div>';
  var box = document.getElementById('andersBox');
  if (box && A[id] === 'Anders, namelijk…') { box.classList.add('show'); document.getElementById('verder').style.display = ''; }
  el.querySelectorAll('.answers button').forEach(function (b) {
    b.addEventListener('click', function () {
      var o = item.opts[b.dataset.i];
      el.querySelectorAll('.answers button').forEach(function (x) { x.classList.remove('picked'); });
      b.classList.add('picked');
      A[id] = label(o);
      if (o.anders) {
        box.classList.add('show'); document.getElementById('verder').style.display = '';
        document.getElementById('andersTxt').focus();
        return;
      }
      if (box) { box.classList.remove('show'); document.getElementById('verder').style.display = 'none'; }
      setTimeout(function () { go(step + 1); }, 220);
    });
  });
  var v = document.getElementById('verder');
  if (v) v.addEventListener('click', function () { A[id + '_anders'] = document.getElementById('andersTxt').value.trim(); go(step + 1); });
}

function multi(el, id, item, head, back) {
  var gekozen = (A[id] || []).slice();
  var heeftAnders = item.opts.some(function (o) { return o.anders; });
  el.innerHTML = head + knoppen(item, gekozen, true) + (heeftAnders ? andersVeld(id) : '') +
    '<div class="nav"><button class="btn" id="verder">Verder</button>' + back + '</div>';
  var btns = el.querySelectorAll('.answers button');
  function sync() {
    btns.forEach(function (b) {
      var o = item.opts[b.dataset.i], on = gekozen.indexOf(label(o)) > -1;
      b.classList.toggle('picked', on);
      b.disabled = !on && gekozen.length >= item.max; // vol: de rest even uit
    });
    var box = document.getElementById('andersBox');
    if (box) box.classList.toggle('show', gekozen.indexOf('Anders, namelijk…') > -1);
    document.getElementById('verder').disabled = gekozen.length === 0;
  }
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      var o = item.opts[b.dataset.i], t = label(o), i = gekozen.indexOf(t);
      if (i > -1) gekozen.splice(i, 1);
      else if (o.alleen) gekozen = [t]; // 'Niets' gaat niet samen met iets anders
      else {
        gekozen = gekozen.filter(function (g) { return !item.opts.some(function (x) { return x.alleen && x.t === g; }); });
        if (gekozen.length < item.max) gekozen.push(t);
      }
      sync();
      if (o.anders && gekozen.indexOf(t) > -1) document.getElementById('andersTxt').focus();
    });
  });
  document.getElementById('verder').addEventListener('click', function () {
    A[id] = gekozen;
    var a = document.getElementById('andersTxt');
    if (a) A[id + '_anders'] = a.value.trim();
    go(step + 1);
  });
  sync();
}

function duo(el, item, head, back) {
  var h = head.replace('<div style="height:14px"></div>', '');
  item.parts.forEach(function (p) {
    h += '<h3>' + p.label + '</h3><div class="answers row" data-part="' + p.id + '">';
    p.opts.forEach(function (o) { h += '<button type="button"' + (A[p.id] === o ? ' class="picked"' : '') + '>' + esc(o) + '</button>'; });
    h += '</div>';
  });
  el.innerHTML = h + '<div class="nav"><button class="btn" id="verder">Verder</button>' + back + '</div>';
  var verder = document.getElementById('verder');
  function sync() { verder.disabled = !item.parts.every(function (p) { return A[p.id]; }); }
  el.querySelectorAll('.answers').forEach(function (g) {
    g.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        g.querySelectorAll('button').forEach(function (x) { x.classList.remove('picked'); });
        b.classList.add('picked');
        A[g.dataset.part] = b.textContent;
        sync();
      });
    });
  });
  verder.addEventListener('click', function () { go(step + 1); });
  sync();
}

function open(el, item, head, back) {
  var h = head;
  item.fields.forEach(function (f) {
    h += '<label class="f"><span>' + f.label + '</span><textarea id="' + f.id + '" maxlength="2000">' + esc(A[f.id] || '') + '</textarea></label>';
  });
  el.innerHTML = h + '<p class="err" id="err">Versturen lukte niet. Probeer het nog een keer.</p>' +
    '<div class="nav"><button class="btn" id="verder">Versturen</button>' + back + '</div>';
  var verder = document.getElementById('verder');
  verder.addEventListener('click', function () {
    item.fields.forEach(function (f) { A[f.id] = document.getElementById(f.id).value.trim(); });
    verder.disabled = true; verder.textContent = 'Even geduld…';
    post('tcbnb_vergoeding_antwoorden', payload()).then(function () { go(step + 1); }, function () {
      verder.disabled = false; verder.textContent = 'Versturen';
      document.getElementById('err').classList.add('show');
    });
  });
}

function nieuws(el) {
  el.innerHTML =
    '<span class="eyebrow">Je antwoorden zijn binnen</span>' +
    '<h2>Wil je horen wat er met jullie antwoorden gebeurt?</h2>' +
    '<p class="hint">Laat je e-mailadres achter. Dan mailen we je zodra er nieuws is over de vergoeding.</p>' +
    '<label class="f"><span>E-mailadres</span><input type="email" id="email" autocomplete="email"></label>' +
    '<p class="soft" style="margin-top:-6px">Niet verplicht. We bewaren je e-mailadres los van je antwoorden.</p>' +
    '<p class="err" id="err">Vul een geldig e-mailadres in.</p>' +
    '<div class="nav"><button class="btn" id="verder">Afronden</button></div>';
  var verder = document.getElementById('verder'), err = document.getElementById('err');
  verder.addEventListener('click', function () {
    var email = document.getElementById('email').value.trim();
    if (!email) return go(step + 1);
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = 'Vul een geldig e-mailadres in.'; err.classList.add('show'); return; }
    verder.disabled = true; verder.textContent = 'Even geduld…';
    post('tcbnb_vergoeding_nieuws', { email: email }).then(function () { go(step + 1); }, function () {
      verder.disabled = false; verder.textContent = 'Afronden';
      err.textContent = 'Versturen lukte niet. Probeer het nog een keer.'; err.classList.add('show');
    });
  });
}

function bedankt(el) {
  bar.style.width = '100%';
  el.innerHTML =
    '<h1>Dank je wel' + (naam ? ', ' + esc(naam) : '') + '!</h1>' +
    '<p>Fijn dat je dit met ons wilde delen. En nog meer dank voor wat je voor je gast hebt gedaan.</p>';
}

function lijst(id) {
  var v = (A[id] || []).slice(), i = v.indexOf('Anders, namelijk…');
  if (i > -1) v[i] = 'Anders: ' + (A[id + '_anders'] || '');
  return v.join(' | ');
}

function payload() {
  var w = gestopt();
  return {
    voornaam: naam,
    wist_van_vergoeding: A.wist,
    nog_gastgezin: !w,
    leeftijd: A.leeftijd, huishouden: A.huishouden,
    hoogte: A.hoogte,
    betekenis: lijst('betekenis'),
    zonder_vergoeding: wist() ? A.zonder : '',
    als_vergoeding_stopt: w ? '' : A.stopt,
    waarom_gestopt: !w ? '' : (A.waarom === 'Anders, namelijk…' ? 'Anders: ' + (A.waarom_anders || '') : A.waarom),
    lastig: lijst('lastig'),
    onverwacht_goed: A.onverwacht_goed || '', onverwacht_minder: A.onverwacht_minder || '',
    bron: (PLEK ? PLEK + ' · ' : '') + (document.referrer || 'direct')
  };
}

function post(collectie, body) {
  return fetch(PB + collectie + '/records', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (r) { if (!r.ok) throw 0; });
}

/* ── koppeling met de ouderpagina: zelfde berichten als de quiz (tcbnbHeight, tcbnbTop) ── */
function toOuder(msg) { if (window.parent !== window) window.parent.postMessage(msg, '*'); }
function sendHeight() { toOuder({ tcbnbHeight: document.body.scrollHeight }); }
window.addEventListener('load', sendHeight);
window.addEventListener('resize', sendHeight);
new MutationObserver(sendHeight).observe(document.body, { childList: true, subtree: true, attributes: true });

// toetsenbord: letters kiezen een antwoord, maar niet terwijl iemand typt
document.addEventListener('keydown', function (e) {
  var tag = document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') {
    if (e.key === 'Enter' && tag === 'INPUT') { var b = document.getElementById('start') || document.getElementById('verder'); if (b) b.click(); }
    return;
  }
  var i = KEYS.indexOf(e.key.toUpperCase());
  var btns = stage.querySelectorAll('.answers:not(.row) button');
  if (i > -1 && btns[i] && !btns[i].disabled) btns[i].click();
});

render();
</script>
</body>
</html>
