<style>
  :root {
    --bg: #FFF5E4;
    --ink: #004542;
    --ink-soft: rgba(0, 69, 66, 0.62);
    --line: rgba(0, 69, 66, 0.22);
    --field: #FFFBF3;
    --font: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* voortgang: een balk die vult, geen nummers */
  .progress { position: fixed; top: 0; left: 0; right: 0; height: 5px; background: var(--line); z-index: 10; }
  .progress i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .35s ease; }

  .site-header { max-width: 620px; margin: 0 auto; padding: 28px 24px 0; }
  .site-header a { display: inline-block; line-height: 0; }
  .logo-mark { width: 130px; height: auto; }

  .stage { max-width: 620px; margin: 0 auto; padding: 24px 24px 64px; min-height: calc(100vh - 70px); display: flex; flex-direction: column; justify-content: center; }
  /* in een iframe op de klantsite: geen eigen logo, en bovenaan beginnen i.p.v. verticaal centreren */
  html.embedded body { min-height: 0; }
  html.embedded .site-header { display: none; }
  html.embedded .stage { min-height: 0; justify-content: flex-start; }

  .screen { display: none; animation: in .3s ease both; }
  .screen.active { display: block; }
  @keyframes in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  h1 { font-weight: 800; font-size: clamp(32px, 7vw, 52px); line-height: 1.02; letter-spacing: -0.01em; margin: 0 0 18px; }
  h2 { font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.2; margin: 0 0 24px; }
  p { margin: 0 0 14px; }
  .soft { color: var(--ink-soft); font-size: 15px; }
  .eyebrow { display: block; font-size: 13px; font-weight: 500; letter-spacing: .08em; color: var(--ink-soft); margin-bottom: 10px; text-transform: uppercase; }

  .btn {
    display: inline-block; font: inherit; font-weight: 800; font-size: 18px;
    color: var(--bg); background: var(--ink); border: 0; border-radius: 999px;
    padding: 15px 30px; cursor: pointer; text-decoration: none; transition: transform .12s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
  .btn:disabled { opacity: .55; cursor: default; transform: none; }

  .answers { display: flex; flex-direction: column; gap: 10px; }
  .answers button {
    font: inherit; text-align: left; color: var(--ink);
    background: var(--field); border: 1.5px solid var(--line); border-radius: 12px;
    padding: 15px 18px 15px 54px; cursor: pointer; position: relative;
    transition: border-color .15s, background .15s, transform .12s;
  }
  .answers button .key {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border: 1.5px solid var(--line); border-radius: 7px;
    font-size: 13px; font-weight: 800; display: grid; place-items: center; background: #fff;
  }
  .answers button:hover, .answers button:focus-visible { border-color: var(--ink); background: #fff; outline: none; }
  .answers button.picked { border-color: var(--ink); background: #fff; transform: scale(.99); }
  .answers button.picked .key { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .nav { display: flex; align-items: center; gap: 18px; margin-top: 26px; }
  .back { font: inherit; background: none; border: 0; color: var(--ink-soft); cursor: pointer; padding: 0; text-decoration: underline; }

  label.f { display: block; margin-bottom: 14px; }
  label.f span { display: block; font-weight: 500; margin-bottom: 6px; }
  input[type="text"], input[type="email"], input[type="tel"] {
    width: 100%; font: inherit; color: var(--ink); background: var(--field);
    border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px;
  }
  input:focus { outline: 3px solid var(--ink); outline-offset: 2px; border-color: var(--ink); }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; margin: 6px 0 20px; }
  .check input { accent-color: var(--ink); width: 18px; height: 18px; margin-top: 3px; flex: 0 0 auto; }
  .err { color: #a33a20; font-size: 14px; margin-top: 8px; display: none; }
  .err.show { display: block; }

  /* resultaat */
  .profile-name { font-size: clamp(38px, 9vw, 64px); line-height: .98; }
  .quote { border-left: 3px solid var(--ink); padding: 6px 0 6px 18px; margin: 26px 0; font-size: 18px; }
  .quote cite { display: block; font-style: normal; font-size: 14px; color: var(--ink-soft); margin-top: 8px; }
  .ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  .share { margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--line); }

  @media (prefers-reduced-motion: reduce) { *, .screen { animation: none !important; transition: none !important; } }
</style>

var KEYS = ['A','B','C','D'];

function setBar() {
  var pct = step < 0 ? 0 : Math.min(100, Math.round((step / QUESTIONS.length) * 100));
  bar.style.width = pct + '%';
}

function render() {
  setBar();
  stage.innerHTML = '';
  var s = document.createElement('section');
  s.className = 'screen active';

  if (step < 0) {
    s.innerHTML =
      '<span class="eyebrow">Takecarebnb</span>' +
      '<h1>Test jezelf: Hoe gastvrij ben jij?</h1>' +
      '<p>Beantwoord deze 8 korte vragen (er zijn geen goede of foute antwoorden). Aan het eind van de quiz weet jij of een gastgezin zijn iets voor je is en wat voor soort gastgezin je dan zou zijn!</p>' +
      '<label class="f" style="margin-top:8px"><span>Hoe mogen we je noemen?</span><input type="text" id="name" autocomplete="given-name" placeholder="Je voornaam" value="' + esc(lead.name) + '"></label>' +
      '<div class="nav"><button class="btn" id="start">Start de quiz</button></div>';
    stage.appendChild(s);
    var nameEl = document.getElementById('name');
    nameEl.focus();
    document.getElementById('start').addEventListener('click', function () {
      lead.name = nameEl.value.trim();
      step = 0; render();
    });
    return;
  }

  if (step < QUESTIONS.length) {
    var item = QUESTIONS[step];
    var qtext = item.q;
    if (lead.name && (step === 0 || step === 7)) qtext = esc(lead.name) + ', ' + qtext.charAt(0).toLowerCase() + qtext.slice(1);
    var html = '<span class="eyebrow">Vraag ' + (step + 1) + ' van ' + QUESTIONS.length + '</span>' +
      '<h2>' + qtext + '</h2><div class="answers" role="group">';
    item.a.forEach(function (opt, i) {
      var picked = answers[step] === opt[1] ? ' picked' : '';
      html += '<button type="button" data-v="' + opt[1] + '" class="' + picked.trim() + '"><span class="key">' + KEYS[i] + '</span>' + opt[0] + '</button>';
    });
    html += '</div><div class="nav">' + (step > 0 ? '<button class="back" id="back">Vorige</button>' : '') + '</div>';
    s.innerHTML = html;
    stage.appendChild(s);
    s.querySelectorAll('.answers button').forEach(function (b) {
      b.addEventListener('click', function () {
        answers[step] = b.dataset.v;
        b.classList.add('picked');
        setTimeout(function () { step++; render(); }, 220);
      });
    });
    var back = document.getElementById('back');
    if (back) back.addEventListener('click', function () { step--; render(); });
    return;
  }

  // resultaat, meteen na de laatste vraag
  var p = PROFILES[result()];
  var greet = lead.name ? esc(lead.name) + ', jij bent' : 'Jij bent';
  s.innerHTML =
    '<span class="eyebrow">' + greet + '</span>' +
    '<h1 class="profile-name">' + p.name + '</h1>' +
    '<p style="font-size:19px">' + p.lead + '</p>' +
    '<p>' + p.fit + '</p>' +
    '<p>' + p.doubt + '</p>' +
    (p.quote ? '<blockquote class="quote">' + p.quote + (p.who ? '<cite>' + p.who + '</cite>' : '') + '</blockquote>' : '') +

    /* zachte leadvraag, per profiel een eigen reden */
    '<div id="leadbox" style="background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:22px 22px 18px;margin:8px 0 26px">' +
      '<h2 style="font-size:22px;margin-bottom:8px">' + p.hook + '</h2>' +
      '<p class="soft" style="margin-bottom:14px">We sturen je drie korte verhalen van gastgezinnen die op jou lijken.</p>' +
      '<label class="f"><span>E-mailadres</span><input type="email" id="email" autocomplete="email"></label>' +
      '<label class="f"><span>Telefoonnummer <em class="soft">(niet verplicht)</em></span><input type="tel" id="phone" autocomplete="tel"></label>' +
      '<label class="check"><input type="checkbox" id="call"> Takecarebnb mag me bellen om te vertellen hoe logeren in de praktijk werkt.</label>' +
      '<p class="err" id="err">Vul een geldig e-mailadres in.</p>' +
      '<div class="nav" style="margin-top:6px"><button class="btn" id="send">Stuur me de verhalen</button></div>' +
      '<p class="soft" style="margin:14px 0 0;font-size:13px">Alleen voor de verhalen en, als je dat aanvinkt, één keer contact. Afmelden van onze mails kan altijd. <a href="https://takecarebnb.org/privacy-voorwaarden/" target="_blank" rel="noopener" style="color:inherit">Privacybeleid</a>.</p>' +
    '</div>' +

    '<h2 style="margin-top:8px">Liever meteen verder?</h2>' +
    '<div class="ctas">' +
      '<a class="btn" href="' + LINKS.inschrijven + '" target="_top">Inschrijven als gastgezin</a>' +
      '<a class="btn ghost" href="' + LINKS.folder + '" target="_top">Informatiefolder aanvragen</a>' +
      '<a class="btn ghost" href="' + LINKS.vragenuur + '" target="_top">Meld je aan voor het vragenuur</a>' +
    '</div>' +
    '<div class="share"><p class="soft">Benieuwd wat voor gastgezin je vrienden zijn?</p><button class="btn ghost" id="share">Deel de quiz</button></div>';
  stage.appendChild(s);
  document.getElementById('send').addEventListener('click', submitLead);
  document.getElementById('share').addEventListener('click', function () {
    var url = location.href.split('?')[0];
    var text = 'Ik ben ' + p.name + '. Hoe gastvrij ben jij? ' + url;
    if (navigator.share) navigator.share({ title: 'Hoe gastvrij ben jij?', text: text, url: url });
    else { navigator.clipboard && navigator.clipboard.writeText(text); this.textContent = 'Link gekopieerd'; }
  });
}

function result() {
  var score = { K: 0, R: 0, W: 0, T: 0 };
  answers.forEach(function (v) { score[v]++; });
  // laatste vraag telt dubbel: die zegt het meest over waar iemand staat
  if (answers[QUESTIONS.length - 1]) score[answers[QUESTIONS.length - 1]]++;
  return Object.keys(score).sort(function (a, b) { return score[b] - score[a]; })[0];
}

function submitLead() {
  var name = lead.name;
  var email = document.getElementById('email').value.trim();
  var phone = document.getElementById('phone').value.trim();
  var call = document.getElementById('call').checked;
  var err = document.getElementById('err');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.classList.add('show'); return; }
  err.classList.remove('show');

  var payload = {
    voornaam: name, email: email, telefoon: phone, mag_bellen: call ? 'ja' : 'nee',
    profiel: PROFILES[result()].name,
    antwoorden: answers.join(''),
    laatste_vraag: QUESTIONS[7].a.filter(function (o) { return o[1] === answers[7]; })[0][0],
    bron: document.referrer || 'direct'
  };

  var btn = document.getElementById('send');
  btn.disabled = true; btn.textContent = 'Even geduld…';

  function done() {
    document.getElementById('leadbox').innerHTML =
      '<h2 style="font-size:22px;margin-bottom:6px">Dank je' + (name ? ', ' + esc(name) : '') + '.</h2>' +
      '<p class="soft" style="margin:0">De verhalen komen eraan.' + (call ? ' En we bellen je binnenkort.' : '') + '</p>';
  }
  if (ENDPOINT.indexOf('VUL-IN') !== -1) { done(); return; } // preview

  function post(url, body) {
    return fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) { if (!r.ok) throw 0; });
  }
  function failed() {
    btn.disabled = false; btn.textContent = 'Stuur me de verhalen';
    err.textContent = 'Versturen lukte niet. Probeer het nog een keer.'; err.classList.add('show');
  }

  // PocketBase krijgt mag_bellen als echte ja/nee-waarde; de rest is gelijk aan wat Formspree krijgt
  var pbPayload = {};
  Object.keys(payload).forEach(function (k) { pbPayload[k] = payload[k]; });
  pbPayload.mag_bellen = call;

  var sends = [post(POCKETBASE_ENDPOINT, pbPayload)];
  if (ENDPOINT) sends.push(post(ENDPOINT, payload));

  // De lead is binnen zodra één van de twee hem heeft opgeslagen
  var ok = 0, pending = sends.length;
  sends.forEach(function (p) {
    p.then(function () { ok++; }, function () {}).then(function () {
      if (--pending === 0) { if (ok) done(); else failed(); }
    });
  });
}

// toetsenbord: A/B/C/D kiest een antwoord, Enter gaat door op intro/gate
document.addEventListener('keydown', function (e) {
  if (step >= 0 && step < QUESTIONS.length) {
    var i = KEYS.indexOf(e.key.toUpperCase());
    var btns = stage.querySelectorAll('.answers button');
    if (i > -1 && btns[i]) btns[i].click();
  } else if (e.key === 'Enter') {
    var b = document.getElementById('start') || document.getElementById('send');
    if (b && document.activeElement.tagName !== 'A') b.click();
  }
});

render();
</script>
</body>
</html>
